[package]
name = "verifpal"
version = "1.3.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "Verifpal - cryptographic protocol analysis"
repository = "https://github.com/symbolicsoft/verifpal"

[lib]
name = "verifpal"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "verifpal"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["clap", "colored", "ureq", "lsp"]
lsp = ["dep:crossbeam-channel", "dep:lsp-server", "dep:lsp-types"]
wasm = ["wasm-bindgen"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4", features = ["derive", "wrap_help"], optional = true }
colored = { version = "3", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
lsp-server = { version = "0.10", optional = true }
lsp-types = { version = "0.97", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
