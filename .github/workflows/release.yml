name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.3.6)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: macos-latest
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - name: Checkout the tag with its full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install zig
        run: |
          python3 -m venv "${RUNNER_TEMP}/zigvenv"
          "${RUNNER_TEMP}/zigvenv/bin/pip" install --quiet "ziglang==${ZIG_VERSION}"
          zigdir=$("${RUNNER_TEMP}/zigvenv/bin/python" -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')
          echo "${zigdir}" >> "$GITHUB_PATH"
          "${zigdir}/zig" version

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Confirm the tag matches Cargo.toml
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          declared=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "${version}" != "${declared}" ]; then
            echo "::error::tag ${tag} does not match Cargo.toml version ${declared}"
            exit 1
          fi
          echo "VERIFPAL_VERSION=${version}" >> "$GITHUB_ENV"
          case "${version}" in
            *-*) echo "VERIFPAL_PRERELEASE=1" >> "$GITHUB_ENV" ;;
            *)   echo "VERIFPAL_PRERELEASE=0" >> "$GITHUB_ENV" ;;
          esac

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Run the exhaustive metamorphic sweeps
        run: make test-exhaustive

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERIFPAL_PUBLISH_WINGET: ${{ vars.VERIFPAL_PUBLISH_WINGET || secrets.VERIFPAL_PUBLISH_WINGET }}

      - name: Verify the generated package manifests describe this release
        if: env.VERIFPAL_PRERELEASE == '0'
        run: |
          git fetch origin master
          failed=0
          if ! git show origin/master:Casks/verifpal.rb 2>/dev/null | grep -q "version \"${VERIFPAL_VERSION}\""; then
            echo "::error::Casks/verifpal.rb on master does not name ${VERIFPAL_VERSION}"
            failed=1
          fi
          if ! git show origin/master:verifpal.json 2>/dev/null | grep -q "\"version\": \"${VERIFPAL_VERSION}\""; then
            echo "::error::verifpal.json on master does not name ${VERIFPAL_VERSION}"
            failed=1
          fi
          exit "${failed}"

      - name: Publish to crates.io
        if: env.VERIFPAL_PRERELEASE == '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is unset; skipping the crates.io publish"
            exit 0
          fi
          published=$(curl -sS -H 'User-Agent: verifpal-release' \
            "https://crates.io/api/v1/crates/verifpal/${VERIFPAL_VERSION}" || true)
          case "${published}" in
            *"\"num\":\"${VERIFPAL_VERSION}\""*)
              echo "::notice::crates.io already has ${VERIFPAL_VERSION}; skipping"
              exit 0
              ;;
          esac
          cargo publish --locked
