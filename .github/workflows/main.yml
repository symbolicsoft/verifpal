name: CI

on:
  push:
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.title.outputs.run }}
    steps:
    - name: Checkout the commit under test
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1
    - name: Look for [ci] in the commit title
      id: title
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "::notice::running because it was dispatched by hand"
          exit 0
        fi
        title=$(git log -1 --pretty=%s)
        echo "commit title: ${title}"
        case "${title}" in
          *"[ci]"*)
            echo "run=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipped: the commit title carries no [ci] marker"
            ;;
        esac

  test:
    name: test (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --release
    - name: Run the exhaustive metamorphic sweeps
      run: cargo test --release -- --ignored --test-threads=1

  wasm:
    name: wasm build
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy
    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-wasm-
    - name: Clippy the wasm library
      run: cargo clippy --lib --no-default-features --features wasm --target wasm32-unknown-unknown -- -D warnings
